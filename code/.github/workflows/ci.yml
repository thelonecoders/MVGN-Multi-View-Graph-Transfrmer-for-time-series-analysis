# GitHub Actions CI workflow for the ST-LLM-Plus VPS Code Bundle.
#
# Runs on every push and pull request. Tests across a matrix of Python
# versions (3.10, 3.11, 3.12) and operating systems (Ubuntu 22.04, 24.04).
# GPU tests are NOT run in CI (GitHub Actions runners do not have GPUs);
# CPU smoke tests + 2-epoch training verify the code path.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff + mypy
        run: |
          pip install --upgrade pip
          pip install "ruff==0.6.9" "mypy==1.11.2"
      - name: Run ruff
        working-directory: code
        run: ruff check mvgt_net scripts tests
      - name: Run mypy
        working-directory: code
        run: mypy mvgt_net --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # mypy warnings are non-blocking

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch + dependencies
        working-directory: code
        run: |
          pip install --upgrade pip
          # CPU-only PyTorch wheel (smaller, faster to install in CI)
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run unit tests
        working-directory: code
        run: |
          python -m pytest tests/ -v --tb=short
      - name: Run 2-epoch smoke training
        working-directory: code
        run: |
          python scripts/train.py --smoke-test --epochs 2 --device cpu --domain Economy_Trade
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            code/results/
            code/.pytest_cache/
          retention-days: 7

  bundle-integrity:
    name: Bundle integrity verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHA-256 checksums
        run: |
          cd "${{ github.workspace }}"
          if [ -f metadata/checksums.sha256 ]; then
            sha256sum -c metadata/checksums.sha256
          else
            echo "metadata/checksums.sha256 not found; skipping"
          fi
      - name: Verify shell scripts pass `bash -n`
        run: |
          cd "${{ github.workspace }}"
          for script in run/*.sh setup/*.sh; do
            echo "Syntax-checking $script"
            bash -n "$script"
          done
      - name: Verify Python files compile
        run: |
          cd "${{ github.workspace }}/code"
          python -m compileall -q mvgt_net scripts tests
