# MVGT-Net default configuration (Chapter 18 protocol).
# Tuned for RTX 3080 Ti (12 GB VRAM) on Ubuntu 24.04.
#
# Used by scripts/train_real.py for all 9 TimeMMD domains.
# Domain-specific overrides (num_nodes, lookback, horizon, input_dim)
# are applied automatically by train_real.py based on the --domain flag
# and the DOMAIN_REGISTRY in mvgt_net/data.py.
#
# To run:
#   # Single domain
#   python scripts/train_real.py --config configs/default.yaml \
#       --domain Climate_AQI --device cuda --epochs 100
#
#   # All 9 domains sequentially
#   python scripts/train_real.py --config configs/default.yaml \
#       --all-domains --device cuda --epochs 100
#
#   # Smoke test (2 epochs, CPU)
#   python scripts/train_real.py --domain Economy_Trade --smoke-test --device cpu

model:
  num_nodes: 1                # All TimeMMD domains are single-node (overridden at runtime)
  input_dim: 1                # TimeMMD OT variable (overridden at runtime)
  hidden_dim: 64              # D=64 per ST-LLM+ Section V-C
  lookback: 96                # P=96 (overridden per-domain: 8 monthly, 36 weekly, 96 daily)
  horizon: 96                 # S=96 (overridden per-domain: 12 monthly, 24 weekly, 96 daily)
  use_text: true              # TimeMMD provides real text facts per record
  use_categorical: false      # TimeMMD has no categorical modality
  num_categories: 0
  text_model: bert-base-uncased   # 110M params, ~440 MB in fp16 → fits in 12 GB VRAM
  graph_types: [spatial, temporal, semantic, adaptive]
  topk: 8                     # k=8 per Section 6-17-4 derivation
  num_heads: 4                # H=4 per ST-LLM+ protocol
  frozen_layers: 6            # F=6 per ST-LLM+ GPT-2 protocol
  unfrozen_layers: 2          # U=2 per ST-LLM+ protocol
  lora_rank: 8                # r=8 per ST-LLM+ protocol; alpha=16 (2x scaling)
  use_qlora: false            # Set true for 4-bit quantization (saves ~330 MB VRAM)
  use_text_gen: false         # TimeMMD does not include text generation targets
  dropout: 0.1

training:
  optimizer: ranger21         # Ranger21 lr=0.001 per ST-LLM+ Section V-C
  learning_rate: 0.001        # 1e-3 per ST-LLM+ Section V-C
  batch_size: 32              # B=32 (safely fits 12 GB VRAM with BERT-base + LoRA)
                             # If OOM: reduce to 16 or 8, or enable use_qlora=true
  max_epochs: 100             # ST-LLM+ uses up to 500; 100 is sufficient with early stop
  weight_decay: 0.0           # Per ST-LLM+ protocol
  warmup_epochs: 5            # Linear warmup for first 5 epochs
  gradient_clip: 1.0          # Clip grad norm to 1.0
  scheduler: cosine           # Cosine LR decay with warmup
  early_stopping_patience: 15 # Stop if val_MAE doesn't improve for 15 epochs
  mixed_precision: fp16       # AMP fp16 for memory efficiency (12 GB GPU)

data:
  domain: Climate_AQI         # overridden by --domain
  data_dir: ../../12_dataset/TimeMMD/
  train_ratio: 0.6            # 6:2:2 chronological split (per ST-LLM+ protocol)
  val_ratio: 0.2
  test_ratio: 0.2
  normalize: standard         # z-score normalization, fit on TRAIN split only
  text_max_length: 128        # Truncate text facts to 128 tokens

loss:
  task_names: [numeric]       # TimeMMD has only numeric targets (no text-gen, no cat)
  history_length: 5           # MultiTaskLoss ring buffer (Formula D)
  hidden_dim: 32              # Weight MLP hidden size

evaluation:
  metrics: [MAE, MSE, RMSE, WAPE, MAPE, sMAPE, R2]
  save_predictions: true
  save_attention: true
  conformal_alpha: 0.1        # 90% prediction intervals (Formula E)

hardware:
  device: cuda                # overridden by --device
  num_workers: 4              # 4 DataLoader workers (good for 8-16 CPU cores)
  pin_memory: true            # Speeds up CPU→GPU transfer

logging:
  experiment_name: mvgtnet_timemmd
  log_dir: ./logs
  checkpoint_dir: ./checkpoints
  results_dir: ./results
  wandb_project: mvgtnet-timemmd
  log_every_n_steps: 50

# Determinism (Chapter 18 protocol)
determinism:
  seed: 42                    # overridden by --seed
  cudnn_deterministic: true
  cudnn_benchmark: false
  cublas_workspace_config: ":4096:8"
